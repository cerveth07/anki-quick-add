name: Publish Windows Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release version and prepare release notes
        shell: pwsh
        run: |
          # A VERSION change on main can publish directly. Manual tag pushes
          # continue to use the existing verified-tag release flow.
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "v$((Get-Content -LiteralPath 'VERSION' -Raw).Trim())"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/release_notes.py "$tag" release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows runtime and UI behavior
        shell: pwsh
        run: |
          python tools/verify_runtime_behavior.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_floating_behavior.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build Windows package
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build_windows.ps1 -PythonLauncher python

      - name: Verify package layout
        shell: pwsh
        run: |
          $required = @(
            "dist/AnkiQuickAdd/AnkiQuickAdd.exe",
            "dist/AnkiQuickAdd/VERSION",
            "dist/AnkiQuickAdd/CHANGELOG.md",
            "dist/AnkiQuickAdd/_internal/PySide6/Qt6Core.dll",
            "dist/AnkiQuickAdd/_internal/PySide6/Qt6Gui.dll",
            "dist/AnkiQuickAdd/_internal/PySide6/Qt6Widgets.dll",
            "dist/AnkiQuickAdd/LICENSE.txt",
            "dist/AnkiQuickAdd/THIRD_PARTY_NOTICES.md",
            "dist/AnkiQuickAdd/licenses/LGPL-3.0-only.txt",
            "dist/AnkiQuickAdd/licenses/GPL-3.0-only.txt",
            "dist/AnkiQuickAdd/licenses/PYTHON-3.12.txt",
            "dist/AnkiQuickAdd/licenses/OPENSSL-3.txt",
            "dist/AnkiQuickAdd/licenses/PYINSTALLER-6.16.0.txt",
            "dist/AnkiQuickAdd/licenses/OFL-Inter.txt",
            "dist/AnkiQuickAdd/licenses/OFL-SourceHanSans.txt",
            "dist/AnkiQuickAdd/licenses/OFL-Noto.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required package file: $path" }
          }

      - name: Smoke-test package
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/AnkiQuickAdd/AnkiQuickAdd.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "AnkiQuickAdd.exe exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          Write-Host "Package startup smoke test passed."

      - name: Create release files
        shell: pwsh
        run: |
          Push-Location dist
          Compress-Archive -Path "AnkiQuickAdd" -DestinationPath "AnkiQuickAdd-Windows.zip" -CompressionLevel Optimal
          Pop-Location
          $hash = (Get-FileHash "dist/AnkiQuickAdd-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AnkiQuickAdd-Windows.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Item "dist/AnkiQuickAdd-Windows.zip", "dist/SHA256SUMS.txt" | Select-Object Name, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            gh release create "$env:RELEASE_TAG" "dist/AnkiQuickAdd-Windows.zip" "dist/SHA256SUMS.txt" --verify-tag --notes-file release-notes.md --title "Anki Quick Add $env:RELEASE_TAG"
          } else {
            # The release command creates the version tag on this exact commit.
            gh release create "$env:RELEASE_TAG" "dist/AnkiQuickAdd-Windows.zip" "dist/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --notes-file release-notes.md --title "Anki Quick Add $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
